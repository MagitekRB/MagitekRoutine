name: release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

# queue: max is what makes consecutive merges each get their own release. Without it a
# concurrency group holds at most ONE pending run, so merging three pull requests in a row
# silently cancels the middle one: three merges, two builds. Do not drop this back to the
# default. cancel-in-progress must stay false; combining it with queue: max is a validation
# error and would fail the workflow before it starts.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

jobs:
  setup:
    name: "Setup"
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/master')
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      previous_tag: ${{ steps.get_version.outputs.previous_tag }}
      previous_sha: ${{ steps.get_version.outputs.previous_sha }}
      cn_tag: ${{ steps.read_manifest.outputs.cn_tag }}
      cn_version: ${{ steps.read_manifest.outputs.cn_version }}
      tc_tag: ${{ steps.read_manifest.outputs.tc_tag }}
      tc_version: ${{ steps.read_manifest.outputs.tc_version }}
    steps:
    - uses: actions/checkout@v4

    - name: Get latest release version
      id: get_version
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $releases = Invoke-RestMethod -Headers @{Authorization = "token $env:GITHUB_TOKEN"} -Uri "https://api.github.com/repos/${{ github.repository }}/releases"
        # Drafts are excluded: a draft left behind by a failed run never shipped, and counting
        # it would base the next version on a release that does not exist. Deriving the same
        # number again is safe — the release step finds the existing draft by tag and updates
        # it instead of stacking a second one.
        $latestVersion = $releases | Where-Object { -not $_.prerelease -and -not $_.draft } | Select-Object -First 1
        if ($latestVersion) {
          # Fail loudly on a malformed tag (e.g. the untagged-<sha> placeholder a mispublished
          # draft carries). Deriving from it would misname this release AND every one after it,
          # since each release's version comes from the previous release's tag.
          if ($latestVersion.tag_name -notmatch '^v(\d+)\.(\d+)\.(\d+)$') {
            throw "Latest release tag '$($latestVersion.tag_name)' is not vMAJOR.MINOR.PATCH; refusing to derive the next version from it. Fix the latest release's tag, then re-run."
          }
          $major = $Matches[1]
          $minor = $Matches[2]
          $patch = [int]$Matches[3] + 1
          echo "version=$major.$minor.$patch" >> $env:GITHUB_OUTPUT
          echo "VERSION=$major.$minor.$patch" >> $env:GITHUB_ENV

          # Both ends of the release-notes range are pinned from this one release so the
          # notes describe exactly this merge. previous_tag is the last PUBLISHED release,
          # so if a release ever fails to publish, its pull requests roll forward into the
          # next set of notes instead of going unannounced.
          echo "previous_tag=$($latestVersion.tag_name)" >> $env:GITHUB_OUTPUT
          echo "previous_sha=$($latestVersion.target_commitish)" >> $env:GITHUB_OUTPUT
        } else {
          $buildNumber = ${{ github.run_number }}
          $newVersion = 50 + $buildNumber
          echo "version=1.0.$newVersion" >> $env:GITHUB_OUTPUT
          echo "VERSION=1.0.$newVersion" >> $env:GITHUB_ENV
        }
        Write-Host "Next version will be: $env:VERSION"
      shell: pwsh

    # Releases are serialized by the concurrency queue above, so this should never fire.
    # It is here because the failure it catches is silent: if a release ever published out
    # of order, releases/latest would point at a commit that predates the previous release
    # and every auto-updating MagitekLoader would quietly pull an older Magitek.dll, with a
    # green check on the run. Compared through the API rather than git so the build keeps
    # its shallow checkout.
    - name: Verify this commit is ahead of the last release
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      run: |
        $prev = '${{ steps.get_version.outputs.previous_sha }}'
        if (-not $prev) {
          Write-Host "No previous release to compare against; nothing to verify."
          exit 0
        }

        $compare = gh api "repos/$env:GITHUB_REPOSITORY/compare/$prev...$env:GITHUB_SHA" | ConvertFrom-Json
        if ($LASTEXITCODE -ne 0 -or -not $compare) {
          throw "Could not compare $prev...$env:GITHUB_SHA to verify release ordering."
        }

        if ($compare.status -ne 'ahead') {
          throw "This commit is '$($compare.status)' relative to the last release ($prev), not 'ahead'. Publishing would move releases/latest onto code that does not contain the previous release. Refusing to build."
        }

        Write-Host "Commit is $($compare.ahead_by) commit(s) ahead of the last release."
      shell: pwsh

    - name: Read regional manifest
      id: read_manifest
      run: |
        $manifest = Get-Content "regional-manifest.json" | ConvertFrom-Json
        $cnTag = $manifest.cn.tag
        $cnVersion = $manifest.cn.version
        $tcTag = $manifest.tc.tag
        $tcVersion = $manifest.tc.version
        
        echo "cn_tag=$cnTag" >> $env:GITHUB_OUTPUT
        echo "cn_version=$cnVersion" >> $env:GITHUB_OUTPUT
        echo "tc_tag=$tcTag" >> $env:GITHUB_OUTPUT
        echo "tc_version=$tcVersion" >> $env:GITHUB_OUTPUT
        
        Write-Host "CN: tag=$cnTag, version=$cnVersion"
        Write-Host "TC: tag=$tcTag, version=$tcVersion"
      shell: pwsh

  build_global:
    name: "Build Global (EN)"
    runs-on: windows-latest
    needs: setup
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: pip install zipfile36

    - name: Restore NuGet packages
      run: |
        cd Magitek
        nuget restore Magitek.sln

    - name: Update AssemblyInfo
      run: |
        $version = "${{ needs.setup.outputs.version }}"
        Write-Host "Updating AssemblyInfo.cs with version $version"
        $assemblyInfoPath = "Magitek/Properties/AssemblyInfo.cs"
        (Get-Content $assemblyInfoPath) -replace '(\[assembly: AssemblyVersion\(")[^"]*("\)\])', "[assembly: AssemblyVersion(`"$version`")]" | Set-Content $assemblyInfoPath
        (Get-Content $assemblyInfoPath) -replace '(\[assembly: AssemblyFileVersion\(")[^"]*("\)\])', "[assembly: AssemblyFileVersion(`"$version`")]" | Set-Content $assemblyInfoPath

    - name: Build solution
      run: |
        cd Magitek
        msbuild Magitek.sln /p:Configuration=Release

    - name: Generate Version.txt
      run: echo "v${{ needs.setup.outputs.version }}" > ./Magitek/bin/release/Version.txt
      
    - name: Create Magitek.zip
      run: |
        python -c "
        import os
        import zipfile

        zip_path = './Magitek/bin/release/Magitek.zip'

        with zipfile.ZipFile(zip_path, 'w') as zipf:
            zipf.write('./Magitek/bin/release/Magitek.dll', arcname='Magitek.dll')
            zipf.write('./Magitek/bin/release/Magitek.pdb', arcname='Magitek.pdb')
            zh_cn_path = './Magitek/bin/release/zh-CN/Magitek.resources.dll'
            if os.path.exists(zh_cn_path):
                zipf.write(zh_cn_path, arcname='zh-CN/Magitek.resources.dll')
            zipf.write('./Magitek/bin/release/Version.txt', arcname='Version.txt')
            zipf.write('./MagitekLoader/MagitekLoader.cs', arcname='MagitekLoader.cs')
            zipf.write('./Magitek/Properties/AssemblyInfo.cs', arcname='Properties/AssemblyInfo.cs')
        "

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: global-build
        path: |
          ./Magitek/bin/release/Magitek.zip
          ./Magitek/bin/release/Version.txt

  build_cn:
    name: "Build CN"
    runs-on: windows-latest
    needs: setup
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.setup.outputs.cn_tag }}

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: pip install zipfile36

    - name: Restore NuGet packages
      run: |
        cd Magitek
        nuget restore Magitek.sln

    - name: Update AssemblyInfo
      run: |
        $cnVersion = "${{ needs.setup.outputs.cn_version }}"
        $globalVersion = "${{ needs.setup.outputs.version }}"
        if ($cnVersion -eq "latest") {
          $version = $globalVersion
        } else {
          $version = $cnVersion
        }
        # Strip 'v' prefix if present (AssemblyVersion format doesn't allow it)
        $version = $version -replace '^v', ''
        Write-Host "Updating AssemblyInfo.cs with version $version"
        $assemblyInfoPath = "Magitek/Properties/AssemblyInfo.cs"
        (Get-Content $assemblyInfoPath) -replace '(\[assembly: AssemblyVersion\(")[^"]*("\)\])', "[assembly: AssemblyVersion(`"$version`")]" | Set-Content $assemblyInfoPath
        (Get-Content $assemblyInfoPath) -replace '(\[assembly: AssemblyFileVersion\(")[^"]*("\)\])', "[assembly: AssemblyFileVersion(`"$version`")]" | Set-Content $assemblyInfoPath
      shell: pwsh

    - name: Build solution
      run: |
        cd Magitek
        msbuild Magitek.sln /p:Configuration=Release

    - name: Generate Version-CN.txt
      run: |
        $cnVersion = "${{ needs.setup.outputs.cn_version }}"
        $globalVersion = "${{ needs.setup.outputs.version }}"
        if ($cnVersion -eq "latest") {
          echo "CN-$globalVersion" > ./Magitek/bin/release/Version-CN.txt
        } else {
          echo "CN-$cnVersion" > ./Magitek/bin/release/Version-CN.txt
        }
      shell: pwsh
      
    - name: Create Magitek-CN.zip
      run: |
        python -c "
        import os
        import zipfile

        zip_path = './Magitek/bin/release/Magitek-CN.zip'

        with zipfile.ZipFile(zip_path, 'w') as zipf:
            zipf.write('./Magitek/bin/release/Magitek.dll', arcname='Magitek.dll')
            zipf.write('./Magitek/bin/release/Magitek.pdb', arcname='Magitek.pdb')
            zh_cn_path = './Magitek/bin/release/zh-CN/Magitek.resources.dll'
            if os.path.exists(zh_cn_path):
                zipf.write(zh_cn_path, arcname='zh-CN/Magitek.resources.dll')
            zipf.write('./Magitek/bin/release/Version-CN.txt', arcname='Version.txt')
            zipf.write('./MagitekLoader/MagitekLoader.cs', arcname='MagitekLoader.cs')
            zipf.write('./Magitek/Properties/AssemblyInfo.cs', arcname='Properties/AssemblyInfo.cs')
        "

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cn-build
        path: |
          ./Magitek/bin/release/Magitek-CN.zip
          ./Magitek/bin/release/Version-CN.txt

  build_tc:
    name: "Build TC"
    runs-on: windows-latest
    needs: setup
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.setup.outputs.tc_tag }}

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: pip install zipfile36

    - name: Restore NuGet packages
      run: |
        cd Magitek
        nuget restore Magitek.sln

    - name: Update AssemblyInfo
      run: |
        $tcVersion = "${{ needs.setup.outputs.tc_version }}"
        $globalVersion = "${{ needs.setup.outputs.version }}"
        if ($tcVersion -eq "latest") {
          $version = $globalVersion
        } else {
          $version = $tcVersion
        }
        # Strip 'v' prefix if present (AssemblyVersion format doesn't allow it)
        $version = $version -replace '^v', ''
        Write-Host "Updating AssemblyInfo.cs with version $version"
        $assemblyInfoPath = "Magitek/Properties/AssemblyInfo.cs"
        (Get-Content $assemblyInfoPath) -replace '(\[assembly: AssemblyVersion\(")[^"]*("\)\])', "[assembly: AssemblyVersion(`"$version`")]" | Set-Content $assemblyInfoPath
        (Get-Content $assemblyInfoPath) -replace '(\[assembly: AssemblyFileVersion\(")[^"]*("\)\])', "[assembly: AssemblyFileVersion(`"$version`")]" | Set-Content $assemblyInfoPath
      shell: pwsh

    - name: Build solution
      run: |
        cd Magitek
        msbuild Magitek.sln /p:Configuration=Release

    - name: Generate Version-TC.txt
      run: |
        $tcVersion = "${{ needs.setup.outputs.tc_version }}"
        $globalVersion = "${{ needs.setup.outputs.version }}"
        if ($tcVersion -eq "latest") {
          echo "TC-$globalVersion" > ./Magitek/bin/release/Version-TC.txt
        } else {
          echo "TC-$tcVersion" > ./Magitek/bin/release/Version-TC.txt
        }
      shell: pwsh
      
    - name: Create Magitek-TC.zip
      run: |
        python -c "
        import os
        import zipfile

        zip_path = './Magitek/bin/release/Magitek-TC.zip'

        with zipfile.ZipFile(zip_path, 'w') as zipf:
            zipf.write('./Magitek/bin/release/Magitek.dll', arcname='Magitek.dll')
            zipf.write('./Magitek/bin/release/Magitek.pdb', arcname='Magitek.pdb')
            zh_cn_path = './Magitek/bin/release/zh-CN/Magitek.resources.dll'
            if os.path.exists(zh_cn_path):
                zipf.write(zh_cn_path, arcname='zh-CN/Magitek.resources.dll')
            zipf.write('./Magitek/bin/release/Version-TC.txt', arcname='Version.txt')
            zipf.write('./MagitekLoader/MagitekLoader.cs', arcname='MagitekLoader.cs')
            zipf.write('./Magitek/Properties/AssemblyInfo.cs', arcname='Properties/AssemblyInfo.cs')
        "

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: tc-build
        path: |
          ./Magitek/bin/release/Magitek-TC.zip
          ./Magitek/bin/release/Version-TC.txt

  release:
    name: "Create Release"
    runs-on: windows-latest
    needs: [setup, build_global, build_cn, build_tc]
    if: startsWith(github.ref, 'refs/heads/master')
    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Get commit message and check if PR merge
      id: get_commit_message
      run: |
        $commitMessage = git log -1 --pretty=%B
        $commitSubject = git log -1 --pretty=%s
        
        $parentCount = (git rev-list --parents -n 1 HEAD).Split(' ').Count - 1
        $hasPRNumber = $commitSubject -match '\(#\d+\)$'
        
        $isPRMerge = ($parentCount -gt 1) -or $hasPRNumber
        
        if ($isPRMerge) {
          Write-Host "Detected PR merge commit (parents: $parentCount, has PR#: $hasPRNumber)"
          echo "IS_PR_MERGE=true" >> $env:GITHUB_ENV
          echo "RELEASE_BODY=" >> $env:GITHUB_ENV
        } else {
          Write-Host "Detected direct commit (parents: $parentCount, has PR#: $hasPRNumber)"
          echo "IS_PR_MERGE=false" >> $env:GITHUB_ENV
          $releaseBody = "## Changes`n`n$commitMessage`n"
          $delimiter = "EOF_RELEASE_BODY"
          echo "RELEASE_BODY<<$delimiter" >> $env:GITHUB_ENV
          echo $releaseBody >> $env:GITHUB_ENV
          echo $delimiter >> $env:GITHUB_ENV
        }
      shell: pwsh

    # Created as a draft so the contributor credits below can be corrected before anyone
    # sees them. Publishing the draft is what fires the release event, so the in-app news
    # feed and the Discord notification both receive the corrected text.
    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ needs.setup.outputs.version }}
        name: v${{ needs.setup.outputs.version }}
        body: ${{ env.RELEASE_BODY }}
        # Both ends of the range are pinned deliberately. The release is created as a draft,
        # so its tag does not exist yet, and target_commitish defaults to the DEFAULT BRANCH
        # rather than this run's commit. Left unset, a build that was queued behind other
        # merges generates its notes against whatever master has since become, so the release
        # lists pull requests its Magitek.dll does not contain and the Discord post is wrong.
        # Patching target_commitish at publish time does not fix it: the body is frozen here.
        target_commitish: ${{ github.sha }}
        previous_tag: ${{ needs.setup.outputs.previous_tag }}
        generate_release_notes: true
        draft: true
        token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        files: |
          ./artifacts/global-build/Magitek.zip
          ./artifacts/global-build/Version.txt
          ./artifacts/cn-build/Magitek-CN.zip
          ./artifacts/cn-build/Version-CN.txt
          ./artifacts/tc-build/Magitek-TC.zip
          ./artifacts/tc-build/Version-TC.txt

    # GitHub credits only the person who opened the pull request, so anyone who committed
    # to it afterwards goes unnamed. Rewrite each entry to list every account that committed
    # to that pull request, opener first.
    #
    # Best effort by design: any failure here leaves the notes exactly as GitHub wrote them,
    # and the publish step still runs, so a bad credit never blocks a release.
    - name: Credit everyone who committed to each pull request
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      run: |
        # gh writes UTF-8, but pwsh decodes captured native output using the console code
        # page, which is not UTF-8 on a Windows runner. Without this, a release note holding
        # any non-ASCII character — a zh-CN pull request title, an em dash, a curly quote —
        # is read back as mojibake and then written straight back, replacing good notes with
        # corrupted ones on the release page, in Discord and in the news feed.
        [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

        $repo = $env:GITHUB_REPOSITORY
        $releaseId = '${{ steps.create_release.outputs.id }}'
        if (-not $releaseId) { Write-Host 'No release id available; leaving notes unchanged.'; exit 0 }

        $body = gh api "repos/$repo/releases/$releaseId" --jq '.body'
        if (-not $body) { Write-Host 'Release body is empty; nothing to credit.'; exit 0 }

        # Matches GitHub's generated form: "* <title> by @<login> in <pull request url>"
        $pattern = '^\* (?<title>.+) by @(?<author>[\w.-]+) in (?<url>https://github\.com/\S+/pull/(?<num>\d+))\s*$'
        $out = New-Object System.Collections.Generic.List[string]

        foreach ($line in ($body -split "`r?`n")) {
          $m = [regex]::Match($line, $pattern)
          if (-not $m.Success) { $out.Add($line); continue }

          $title  = $m.Groups['title'].Value
          $author = $m.Groups['author'].Value
          $url    = $m.Groups['url'].Value
          $num    = $m.Groups['num'].Value

          $jq = '[.[].author | select(. != null) | .login] | unique | .[]'
          $raw = gh api "repos/$repo/pulls/$num/commits" --paginate --jq $jq

          $logins = @()
          if ($LASTEXITCODE -eq 0 -and $raw) { $logins = @($raw -split "`r?`n") }
          else { Write-Host "PR #${num}: could not read commit authors; keeping GitHub's credit." }

          # Opener stays first; bots never get credited.
          $extra = $logins |
            Where-Object { $_ -and $_ -ne $author -and $_ -notmatch '\[bot\]$' } |
            Select-Object -Unique

          $credit = ((@($author) + @($extra)) | ForEach-Object { "@$_" }) -join ', '
          $out.Add("* $title by $credit in $url")

          if ($extra) { Write-Host "PR #${num}: credited $credit" }
        }

        # Via a file rather than stdin so non-ASCII pull request titles survive the round trip.
        $payloadFile = Join-Path $env:RUNNER_TEMP 'release-body.json'
        @{ body = ($out -join "`n") } | ConvertTo-Json -Depth 3 -Compress |
          Out-File -FilePath $payloadFile -Encoding utf8 -NoNewline

        gh api "repos/$repo/releases/$releaseId" -X PATCH --input $payloadFile | Out-Null
        Write-Host 'Release notes updated.'
      shell: pwsh

    # Deliberately not always(): that would also publish during a cancelled run, defeating
    # the point of the draft window. The credit step is continue-on-error, so it cannot fail
    # the job, and this step still runs after it fails.
    #
    # Retried, because leaving the release a draft is the worst outcome available — no tag
    # moves, releases/latest keeps pointing at the previous version, MagitekLoader never
    # auto-updates, and nothing posts anywhere until a human notices and re-runs.
    - name: Publish Release
      if: ${{ !cancelled() && steps.create_release.outputs.id != '' }}
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      run: |
        $repo = $env:GITHUB_REPOSITORY
        $releaseId = '${{ steps.create_release.outputs.id }}'
        $tag = 'v${{ needs.setup.outputs.version }}'
        $sha = $env:GITHUB_SHA

        # tag_name and target_commitish must be sent here, not just draft=false. A draft
        # release has no git tag yet, so GitHub holds it under an "untagged-<sha>"
        # placeholder; publishing without restating the tag keeps that placeholder as the
        # release's tag_name and never creates the tag. That breaks the compare link, and
        # worse, the setup job derives the next version by splitting the latest release's
        # tag_name on "." — an untagged placeholder yields a garbage version number.
        for ($attempt = 1; $attempt -le 3; $attempt++) {
          gh api "repos/$repo/releases/$releaseId" -X PATCH `
            -F draft=false -f tag_name="$tag" -f target_commitish="$sha" | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Published release $releaseId as $tag."
            exit 0
          }
          if ($attempt -lt 3) {
            Write-Host "Publish attempt $attempt failed; retrying in 15s."
            Start-Sleep -Seconds 15
          }
        }

        throw "Could not publish release $releaseId after 3 attempts; it is still a draft."
      shell: pwsh

    # The tag is the thing that broke last time and it fails silently, so assert it rather
    # than trusting the publish call's exit code.
    - name: Verify the release is tagged
      if: ${{ !cancelled() && steps.create_release.outputs.id != '' }}
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      run: |
        $repo = $env:GITHUB_REPOSITORY
        $releaseId = '${{ steps.create_release.outputs.id }}'
        $expected = 'v${{ needs.setup.outputs.version }}'

        $release = gh api "repos/$repo/releases/$releaseId" | ConvertFrom-Json
        if ($LASTEXITCODE -ne 0 -or -not $release) {
          throw "Could not read release $releaseId to verify it."
        }
        if ($release.draft) {
          throw "Release $releaseId is still a draft. No tag exists, releases/latest still points at the previous version, and MagitekLoader will not auto-update."
        }
        if ($release.tag_name -ne $expected) {
          throw "Release $releaseId published as tag '$($release.tag_name)', expected '$expected'. The next release's version number is derived from this and will be wrong."
        }

        # git/ref (singular) is an exact-match lookup and 404s when the tag is missing. The
        # plural git/refs form prefix-matches: it can return 200 with an array of OTHER tags
        # even when this one does not exist, which would make this check pass vacuously.
        gh api "repos/$repo/git/ref/tags/$expected" | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "Release tag $expected does not exist as a git ref." }

        Write-Host "Release is correctly tagged $expected."
      shell: pwsh
